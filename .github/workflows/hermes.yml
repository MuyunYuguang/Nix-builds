name: Build Hermes Desktop

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Generate flake.lock
        working-directory: hermes
        run: nix flake lock

      - name: Commit flake.lock
        working-directory: hermes
        run: |
          if [ -z "$(git status --porcelain flake.lock)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore(hermes): update flake.lock [skip ci]"
          git push

      - name: Build Hermes Desktop
        working-directory: hermes
        run: nix build .#default --print-build-logs
